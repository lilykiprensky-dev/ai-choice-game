<!doctype html>
<!--
UI CUSTOMIZATION GUIDE
1. 色：CSS冒頭の「★ 色を変更する場所」のカスタムプロパティを変更します。
2. イラスト：「★ イラストを差し替える場所」を検索し、illustration: null を
   illustration: "assets/report/step1-b.png" のような相対パスに変更します。
   scenesの画像はシーンカードと導入、stepsは状況、choicesは選択・結果・ログに表示。
3. 保存先：assets/title、scenes、report、interview、parttime、travel。
   PNG / JPG / WebP / SVGに対応。未設定・読込失敗はプレースホルダーになります。
4. ポイントバー：--meter-height と --time-color / --resource-color / --quality-color。
   棒の尺度は各シーンで取り得る累積最大値。上限・達成目標ではありません。
5. 角丸・枠線：--card-radius / --card-border-width / --card-gap。
7. 回答収集：「★ Googleフォームの接続設定」を検索。公開手順.mdを参照。
6. 配置：「★ スマホ／PCのカード配置を変更する場所」を検索。
   初期設定は縦1列。画面幅900px以上で選択カードが横3列になります。
-->

// ===== ゲーム内容の編集はここまで =====

// 補足文と振り返りの質問。実際の電力・水の単位にポイントを換算しません。
const disclaimer = '※各ポイントはゲーム内で比較するための仮想値です。実際の環境負荷は、AIモデル、処理内容、データセンター、地域、電源構成などによって異なります。';
const questions = [
 '今回、AIを使ってよかったと思った場面はどこでしたか？それはなぜですか？',
 '逆に、AIではなく検索・専用ツール・自分自身でやってもよかったかもしれない、と思った場面はありましたか？',
 '次にAIを使うとき、時間や便利さ以外に、どんなことを考えてみたいですか？'
];
const metrics = [['timeCost','TIME COST','時間消費'],['resourceCost','RESOURCE COST','資源消費'],['quality','QUALITY','品質']];
const app = document.getElementById('app');
const dialog = document.getElementById('restart-dialog');
// 選択履歴から累積値を計算。画面の再描画ではポイントを加算しません。
let sceneIndex = null;
let stepIndex = 0;
let phase = 'home';
let history = [];
const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function totals(){return history.reduce((total,entry)=>{for(const [key] of metrics)total[key]+=scenes[sceneIndex].steps[entry.step].choices[entry.choice][key];return total;},{timeCost:0,resourceCost:0,quality:0});}
// 各指標ごとに、そのシーンの各Stepの最大値を合計して棒の尺度にします。
// 尺度はシーン開始時から固定。ポイントの上限やクリア条件ではありません。
function meterMaximum(key) {
  return scenes[sceneIndex].steps.reduce((sum, step) => sum + Math.max(...step.choices.map(choice => choice[key])), 0) || 1;
}
function scoreCards(values, delta=false) {
  const hints = ['使った時間','相対的な資源消費','得られた成果'];
  return `<div class="metrics" ${delta?'':'aria-label="累積ポイント"'}>${metrics.map(([key,en,jp],i) => {
    const max = delta ? Math.max(1,...scenes[sceneIndex].steps[stepIndex].choices.map(choice=>choice[key])) : meterMaximum(key);
    const percent = Math.min(100,Math.max(0,values[key]/max*100));
    return `<div class="metric metric-${key}"><span class="en">${en}</span><span class="jp">${jp}</span><span class="hint">${hints[i]}</span><b data-score="${key}">${delta?'+':''}${values[key]}</b><small>pt</small>${delta?'':`<span class="meter" role="meter" aria-label="${jp}" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${values[key]}" aria-valuetext="${values[key]} pt"><span class="meter-fill" style="width:${percent}%"></span></span>`}</div>`;
  }).join('')}</div>${delta?'':'<p class="scale-note">棒は、このシーンで取り得る各指標の最大値を尺度に表示しています（目標値ではありません）。</p>'}`;
}
// ★ イラストを差し替える場所：上のデータのillustrationに相対パスを設定。
// 読込完了までプレースホルダーを表示。パスが間違っていてもレイアウトを保ちます。
function illustration(path, label, size='') {
  return `<span class="illustration ${size}" role="img" aria-label="${escapeHTML(label)}"><span class="placeholder"><b>ILLUSTRATION</b><span>${escapeHTML(label)}</span></span>${path?`<img src="${escapeHTML(path)}" alt="${escapeHTML(label)}" hidden>`:''}</span>`;
}
function choiceImage(step, choice, size='thumb') {
  return illustration(scenes[sceneIndex].steps[step].choices[choice].illustration,`SCENE ${sceneIndex+1} / STEP ${step+1} / CHOICE ${'ABC'[choice]}`,size);
}
function deltas(choice){return `<div class="deltas">${metrics.map(([key,en])=>`<span>${en} <b>+${choice[key]}</b> pt</span>`).join('')}</div>`;}
function note(){return `<p class="note">${disclaimer}<br>資源消費0 ptも、現実の環境負荷がゼロという意味ではありません。結果はこの場面での一例です。</p>`;}
function mount(html){app.innerHTML=html;
  app.querySelectorAll('.illustration img').forEach(img=>{
    const show=()=>{img.hidden=false;img.previousElementSibling.hidden=true;};
    const fallback=()=>{img.hidden=true;img.previousElementSibling.hidden=false;};
    img.addEventListener('load',show);
    img.addEventListener('error',fallback);
    if(img.complete){if(img.naturalWidth>0)show();else fallback();}
  });window.scrollTo(0,0);const heading=app.querySelector('h1, h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}}
function home(){phase='home';sceneIndex=null;stepIndex=0;history=[];mount(`
 <p class="eyebrow">4 SCENES / EVERYDAY CHOICES</p><h1>今日も、とりあえずAI？</h1>
 <p class="lead">レポートも、面接も、日常の連絡も。<br>いつもの選択を、時間・資源・品質から見つめてみよう。</p>
 ${illustration(titleIllustration,'TITLE / MAIN','hero')}<h2>どの場面から始める？</h2>
 <div class="scene-grid">${scenes.map((scene,i)=>`<button class="scene-card" data-scene="${i}"><span class="scene-no">SCENE ${i+1} / ${['レポート','面接','バイト','旅行'][i]}</span><strong>${escapeHTML(scene.title)}</strong>${illustration(scene.illustration,`SCENE ${i+1}`)}<span class="go">4 STEPをプレイする →</span></button>`).join('')}</div>
 <section class="guide"><h3>遊び方</h3><p>各Stepで3つの方法から1つを選び、結果を読んで次へ。4 Stepを終えたらクリアです。最後に、選んだ方法と他の方法を振り返ります。</p><p><b>時間消費</b>：高いほど時間を使った<br><b>資源消費</b>：高いほどAIやデジタル処理の相対的な資源消費が大きい<br><b>品質</b>：高いほど目的に対して良い成果を得た</p><p>3つの値は0から累積します。総合点やランクはありません。何を大切にするか考えながら選んでみてください。</p></section>${note()}`);}
function header(){const scene=scenes[sceneIndex];return `<div class="stage-top"><p class="eyebrow">SCENE ${sceneIndex+1} <span aria-hidden="true"> / </span> STEP ${stepIndex+1} / 4</p><button class="quiet" data-action="restart">シーン選択へ</button></div><p class="scene-name">${escapeHTML(scene.title)}</p><div class="hud">${scoreCards(totals())}</div><div class="progress" aria-label="${history.length} / 4 Step完了">${[0,1,2,3].map(i=>`<span class="${i<history.length?'done':''}"></span>`).join('')}</div>`;}
// シーン選択後、導入イラストと状況を確認してから4 Stepを開始します。
function renderIntro() {
  phase='intro';
  const scene=scenes[sceneIndex];
  mount(`${header()}<p class="eyebrow">SCENE INTRODUCTION</p><h1>${escapeHTML(scene.title)}</h1>${illustration(scene.illustration,`SCENE ${sceneIndex+1} / INTRO`,'hero')}<p class="situation">${escapeHTML(scene.intro)}</p><p>4つの場面で、あなたならどうするか選んでみてください。</p><button class="primary" data-action="start">STEP 1を始める</button>${note()}`);
}
function renderStep(){phase='step';const scene=scenes[sceneIndex],step=scene.steps[stepIndex];mount(`${header()}<h1>${escapeHTML(step.title)}</h1>${stepIndex===0?`<p class="intro">${escapeHTML(scene.intro)}</p>`:''}<p class="situation">${escapeHTML(step.situation)}</p>${illustration(step.illustration,`SCENE ${sceneIndex+1} / STEP ${stepIndex+1}`)}<p class="eyebrow">あなたなら、どうする？</p><div class="choices">${step.choices.map((choice,i)=>`<button class="choice tone-${i}" data-choice="${i}"><span class="choice-top"><span class="letter">CHOICE ${'ABC'[i]}</span><span class="choice-text">${escapeHTML(choice.text)}</span></span>${choiceImage(stepIndex,i,'')}${deltas(choice)}</button>`).join('')}</div>${note()}`);}
function renderFeedback(){const entry=history[history.length-1],choice=scenes[sceneIndex].steps[stepIndex].choices[entry.choice];mount(`${header()}<p class="eyebrow">STEP ${stepIndex+1} / ${escapeHTML(scenes[sceneIndex].steps[stepIndex].title)}</p><h1>選択のあとに</h1><section class="panel selected tone-${entry.choice}"><p class="eyebrow">あなたの選択</p><h3>${escapeHTML(choice.text)}</h3>${choiceImage(stepIndex,entry.choice)}<p class="label">今回の変化</p>${scoreCards(choice,true)}<p class="label">RESULT</p><p>${escapeHTML(choice.result)}</p><div class="point"><p class="eyebrow">POINT</p><p>${escapeHTML(choice.explanation)}</p></div></section><button class="primary" data-action="next">${stepIndex===3?'次へ：今日の選択を振り返る':'次へ：STEP '+(stepIndex+2)}</button>${note()}`);}
function renderLog(){phase='log';mount(`${header()}<p class="eyebrow">YOUR CHOICES / 振り返り 1 / 3</p><h1>自分の選択の振り返り</h1><p class="lead">4 Stepをクリアしました。時間・資源・品質の違いと、あなたが選んだ理由を振り返ってみましょう。</p><div class="log">${history.map(entry=>{const step=scenes[sceneIndex].steps[entry.step],choice=step.choices[entry.choice];return `<article class="panel log-card selected tone-${entry.choice}"><p class="eyebrow">STEP ${entry.step+1}</p><h2>${escapeHTML(step.title)}</h2><p class="label">あなたの選択</p><h3>${escapeHTML(choice.text)}</h3>${choiceImage(entry.step,entry.choice)}${deltas(choice)}<p class="label">RESULT</p><p>${escapeHTML(choice.result)}</p><div class="point"><p class="eyebrow">POINT</p><p>${escapeHTML(choice.explanation)}</p></div><details><summary>他の選択肢を見る</summary>${step.choices.map((other,i)=>i===entry.choice?'':`<section class="alternative tone-${i}"><p><b>${'ABC'[i]}　${escapeHTML(other.text)}</b></p>${choiceImage(entry.step,i)}${deltas(other)}<p class="label">RESULT</p><p>${escapeHTML(other.result)}</p></section>`).join('')}</details></article>`;}).join('')}</div>
<button class="primary" data-action="debrief">次へ：少し立ち止まって考える</button>${note()}`);}
// ★ Googleフォームの接続設定
// フォームの「事前入力したリンク」から /viewform のURLとentry番号を転記します。
// 空欄のままでもゲームは動きます。設定手順は「公開手順.md」を参照。
const GOOGLE_FORM = {
  url: 'https://docs.google.com/forms/d/e/1FAIpQLSd6F9O5VTr-Vfwcm7ngrQwCPPdZ1aa2L8Wg8do4G665gB5-1w/viewform',
  fields: {
    gameVersion: 'entry.301693721', scene: 'entry.827385708',
    step1: 'entry.52159654', step2: 'entry.1629776297',
    step3: 'entry.1701321786', step4: 'entry.1374748187',
    timeCost: 'entry.1690043208', resourceCost: 'entry.904648409', quality: 'entry.1434385836'
  }
};
const GAME_VERSION = '2026-09-25-pages-v1';

// フォームに渡すのは短い履歴のみ。自由記述はフォーム側で記入します。
function formValues() {
  const scene = scenes[sceneIndex];
  const values = {gameVersion: GAME_VERSION, scene: scene.id + ' / ' + scene.title, ...totals()};
  history.forEach(entry => {
    const step = scene.steps[entry.step];
    values['step' + (entry.step + 1)] = 'CHOICE ' + 'ABC'[entry.choice] + ' / ' + step.choices[entry.choice].text;
  });
  return values;
}
function formReady() {
  // 短縮URLでは事前入力の設定ができないので、通常の公開フォームURLを使います。
  const keys = ['gameVersion','scene','step1','step2','step3','step4','timeCost','resourceCost','quality'];
  const ids = keys.map(key => GOOGLE_FORM.fields[key]);
  return /^https:\/\/docs\.google\.com\/forms\/(?:u\/\d+\/)?d\/(?:e\/)?[A-Za-z0-9_-]+\/viewform$/.test(GOOGLE_FORM.url)
    && ids.every(id => /^entry\.\d+$/.test(id)) && new Set(ids).size === keys.length;
}
function googleFormLink() {
  if (!formReady() || history.length !== 4) return '';
  const values = formValues();
  const params = ['usp=pp_url'];
  for (const key of Object.keys(values)) {
    params.push(encodeURIComponent(GOOGLE_FORM.fields[key]) + '=' + encodeURIComponent(String(values[key])));
  }
  return GOOGLE_FORM.url + '?' + params.join('&');
}
function reviewHeader(page) {
  return `<p class="eyebrow">SCENE ${sceneIndex+1} / 振り返り ${page} / 3</p>`;
}
function renderDebrief() {
  phase='debrief';
  const link = googleFormLink();
  mount(`${reviewHeader(2)}<h1>少し立ち止まって考える</h1>
  <section class="panel debrief"><p>次の3つの問いを振り返ってみましょう。回答はGoogleフォームで記入します。参加・回答は任意です。自由記述には氏名や連絡先を記入しないでください。</p>
  ${questions.map((q,i)=>`<p class="reflection-question"><span class="qno">Q${i+1}</span>${escapeHTML(q)}</p>`).join('')}
  <p>フォームには、今回のシーン・4 Stepの選択・最終ポイント・ゲームのバージョンが入力済みで表示されます。内容を確認し、振り返りを記入して「送信」を押してください。</p>
  ${link ? `<a class="primary form-link" href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer">選択履歴を引き継いでGoogleフォームへ ↗</a><p class="note">別タブで開きます。回答後はこのゲームのタブに戻って、次へ進んでください。</p>` : '<button class="primary" disabled>回答フォームは準備中です</button><p role="status">今は回答を収集していません。そのまま次へ進めます。</p>'}
  <p class="note">フォームを開くだけでは回答は保存されません。ゲーム側では送信完了を確認できません。フォームで送信が完了したことをご確認ください。</p>
  </section>
  <button class="secondary" data-action="back-log">自分の選択の振り返りに戻る</button>
  <button class="primary" data-action="closing">次へ：目的に合わせて、使い分ける</button>`);
}
function renderClosing(){phase='closing';mount(`${reviewHeader(3)}
 <section class="closing"><h1>目的に合わせて、使い分ける</h1><p>生成AIは、考えを広げたり、文章を整えたり、練習相手になったりできる便利な道具です。一方で、AIを動かすためにも電力や水などの資源が使われています。</p><p>すべてをAIに任せればよいわけでも、すべてを自分だけでやればよいわけでもありません。</p><p>「ここはAIに助けてもらう」<br>「ここは検索や専用ツールを使う」<br>「ここは自分で考えてみる」</p><p>目的に合わせて使い分けることも、これからのAIリテラシーの一つかもしれません。AIの便利さを活かしながら、資源やエネルギーにも目を向け、自分自身で考える力も育てていく。</p><p class="question">あなたなら、次はどうAIを使いますか？</p></section>
 <details class="environment"><summary>AIと資源消費について</summary><ul><li>生成AIの利用には、データセンターでの電力消費が伴います。</li><li>サーバーの冷却や発電などを通して、水利用とも関係しています。</li><li>負荷は、AIモデル、処理内容、設備、地域、電源構成などによって異なります。</li><li>1回のAI利用について、ユーザーが正確な環境負荷を知るのは難しいのが現状です。</li><li>利用者の使い方に加え、企業による環境負荷データの公開や、負荷を減らす努力も重要です。</li></ul><p class="note">参考：学生作成「卒論研究メモ」。このゲームのRESOURCE COSTは、実際の電力量や水の量を示すものではありません。</p></details>${note()}<button class="secondary" data-action="back-debrief">回答画面に戻る</button><button class="primary" data-action="restart">シーン選択に戻る・もう一度遊ぶ</button>`);}
// 画面状態を確かめてから処理し、同じStepの重複加算を防ぎます。
app.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
 if(button.dataset.scene!==undefined&&phase==='home'){sceneIndex=Number(button.dataset.scene);stepIndex=0;history=[];renderIntro();}
 else if(button.dataset.action==='start'&&phase==='intro'){renderStep();}
 else if(button.dataset.choice!==undefined&&phase==='step'){phase='feedback';history.push({step:stepIndex,choice:Number(button.dataset.choice)});renderFeedback();}
 else if(button.dataset.action==='next'&&phase==='feedback'){if(stepIndex===3)renderLog();else{stepIndex++;renderStep();}}
 else if(button.dataset.action==='debrief'&&phase==='log')renderDebrief();
 else if(button.dataset.action==='back-log'&&phase==='debrief')renderLog();
 else if(button.dataset.action==='closing'&&phase==='debrief')renderClosing();
 else if(button.dataset.action==='back-debrief'&&phase==='closing')renderDebrief();
 else if(button.dataset.action==='restart')dialog.showModal();
});
document.getElementById('cancel-restart').addEventListener('click',()=>dialog.close());
document.getElementById('confirm-restart').addEventListener('click',()=>{dialog.close();home();});
home();
</script>
